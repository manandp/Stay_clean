name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # The remaining high findings are in Expo's build tooling (CLI, Metro), not app code,
      # and have no patched versions yet. Raise this to "high" once Expo ships fixes.
      - name: Check for critical vulnerable dependencies
        run: pnpm audit --prod --audit-level critical
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
